<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Minecraft Architecture Workbench</title><style>
:root{font-family:Inter,system-ui,sans-serif;color:#e9e5dc;background:#121917}*{box-sizing:border-box}body{margin:0}header{display:flex;justify-content:space-between;align-items:center;padding:20px 28px;border-bottom:1px solid #3b4540}h1{font-size:18px;margin:0;font-weight:600}small{color:#aab6ad}main{display:grid;grid-template-columns:300px 1fr;min-height:calc(100vh - 65px)}aside{padding:28px;border-right:1px solid #3b4540}h2{font-size:13px;color:#bdc9c1;text-transform:uppercase;letter-spacing:.1em;margin-top:28px}p,li{font-size:14px;line-height:1.55}ul{padding-left:18px}strong{color:#fff}.value{font-size:16px;margin-top:4px}.tag{display:inline-block;border:1px solid #66766c;padding:5px 8px;border-radius:4px;font-size:12px}article{padding:20px;display:grid;grid-template-rows:auto 1fr;gap:14px}iframe{width:100%;height:calc(100vh - 128px);border:1px solid #4c5d50;border-radius:6px;background:#323d39}.empty{border:1px dashed #66766c;border-radius:6px;padding:48px;align-self:center;text-align:center;color:#bfc9c1}button{background:#263b32;border:1px solid #718577;color:#f4f1e7;padding:6px 12px;margin-left:8px;border-radius:4px;cursor:pointer}button:hover{background:#365243}.audit{border-top:1px solid #3b4540;padding-top:8px}.audit p{margin:5px 0}@media(max-width:800px){main{display:block}aside{border-right:0;border-bottom:1px solid #3b4540}iframe{height:70vh}}
</style><header><h1>Minecraft Architecture <small> / Workbench</small></h1><span class="tag" id="mode">Loading</span></header><main><aside><small>PROJECT</small><div class="value" id="name"></div><h2>Site</h2><p id="site"></p><h2>Design intent</h2><p id="brief"></p><h2>Review gates</h2><ul><li>Survey provenance and bounds</li><li>Structure, circulation and headroom</li><li>Interior, floor and physical lighting</li><li>Before state, protected cells and rollback</li></ul><div class="audit" id="audit"></div><small id="version"></small></aside><article><div><strong>Interactive model</strong> <small> / rotate, zoom and inspect</small> <span id="views"></span></div><div id="viewport"></div></article></main><script type="module">
const p=await(await fetch('/api/project')).json();const by=id=>document.getElementById(id);by('mode').textContent=p.mode||'preview';by('name').textContent=p.name;by('site').textContent=p.bounds?`${p.dimension} · ${p.bounds.min.join(', ')} → ${p.bounds.max.join(', ')}`:'Site not assigned';by('brief').textContent=p.design?.brief||'Add a brief to project.json';by('version').textContent=`Java ${p.version} · ${p.version==='1.21.8'?'baseline':'experimental'}`;
const audit=by('audit');const add=(s)=>{const e=document.createElement('p');e.textContent=s;audit.append(e)};if(p.reports?.diff)add(`Planned changes: ${p.reports.diff.changes} · removals: ${p.reports.diff.removals}`);if(p.reports?.preflight)add(`Live preflight: ${p.reports.preflight.ready} ready · ${p.reports.preflight.applied} already applied · ${p.reports.preflight.conflicts} conflicts`);for(const z of p.reports?.lighting||[])add(`${z.zone}: mean ${z.mean.toFixed(1)} · minimum ${z.min} · P05 ${z.p05} · ${z.pass?'passes':'needs attention'}`);if(!audit.children.length)add('Add diff, preflight and lighting reports to project.json to see objective checks here.');
const entries=Object.entries(p.previewUrls||{});for(const [key,url] of entries){const button=document.createElement('button');button.textContent=key;button.onclick=()=>{const frame=document.createElement('iframe');frame.title=key;frame.src=url;by('viewport').replaceChildren(frame)};by('views').append(button)}
if(entries.length)by('views').firstElementChild.click();else by('viewport').innerHTML='<div class="empty">Add an NBT path under artifacts.model in project.json to view the design.</div>';
</script></html>
