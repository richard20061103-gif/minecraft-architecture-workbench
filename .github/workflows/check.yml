name: Check
on: [push, pull_request]
jobs:
  workflow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm
          cache-dependency-path: skills/minecraft-architecture/npm-shrinkwrap.json
      - run: npm ci --omit=dev
        working-directory: skills/minecraft-architecture
      - run: npm run check
      - run: node skills/minecraft-architecture/scripts/run-build.mjs skills/minecraft-architecture/assets/examples/celestial-forge.mjs --out-dir /tmp/mc-architecture-smoke --name smoke --json
      - run: npm pack --dry-run
        working-directory: skills/minecraft-architecture
