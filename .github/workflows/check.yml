name: Check
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
jobs:
  workflow:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        node: ['22.16.0', '24']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: skills/minecraft-architecture/npm-shrinkwrap.json
      - run: npm ci --omit=dev
        working-directory: skills/minecraft-architecture
      - run: npm run check
      - run: node bin/mc-architecture.mjs demo --project .workbench/ci-demo
      - run: npm pack --dry-run
        working-directory: skills/minecraft-architecture
